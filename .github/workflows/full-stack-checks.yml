name: Full-stack simulator checks

on:
  push:
    branches: [main, "feat/node-full-stack-platform"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run API and database tests
        run: npm test
